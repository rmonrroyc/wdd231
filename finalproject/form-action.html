<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Ricardo [Last Name]">
    <meta name="description" content="Form submission results.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Submitted | One Page Web Studio</title>

    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">
</head>

<body>

<header>
    <h1>Submission Received</h1>
</header>

<main>
    <section id="results"></section>
</main>

<script>
    const results = document.querySelector("#results");
    const params = new URLSearchParams(window.location.search);

    results.innerHTML = `
        <h2>Thank you, ${params.get("fullname")}!</h2>
        <p><strong>Email:</strong> ${params.get("email")}</p>
        <p><strong>Business Type:</strong> ${params.get("business")}</p>
        <p><strong>Budget:</strong> $${params.get("budget")}</p>
        <p><strong>Project Description:</strong> ${params.get("message")}</p>
    `;
</script>

</body>
</html>
